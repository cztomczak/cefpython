name: CI Linux

on:
  push:
    branches: ["master", "cefpython147"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 147.1 or 147.0.1 (empty: dev version)"
        type: string
        default: ""
      bypass_cache:
        description: "Bypass all caches for a clean run"
        type: boolean
        default: false

jobs:
  download-cef:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      cef_version: ${{ steps.cef-version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read CEF version
        id: cef-version
        run: |
          ver=$(grep -oP '(?<=#define CEF_VERSION ")[^"]+' src/version/cef_version_linux.h)
          echo "value=$ver" >> $GITHUB_OUTPUT

      - name: Cache CEF binaries
        uses: actions/cache@v5
        if: ${{ inputs.bypass_cache != true }}
        with:
          path: |
            build/cef_binary_*
            build/cef*_linux64
          # Keyed on the CEF version (each version gets its own cache) and on the
          # download/prepare scripts (invalidate when they change).
          key: cef-linux64-${{ hashFiles('tools/download_cef.py', 'tools/automate.py') }}-${{ steps.cef-version.outputs.value }}

      - name: Install build tools
        run: python tools/requirements.py

      - name: Download CEF binaries
        run: python tools/download_cef.py

  build:
    needs: download-cef
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history for the dev version (git commit count)

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore CEF cache
        uses: actions/cache/restore@v5
        if: ${{ inputs.bypass_cache != true }}
        with:
          path: |
            build/cef_binary_*
            build/cef*_linux64
          key: cef-linux64-${{ hashFiles('tools/download_cef.py', 'tools/automate.py') }}-${{ needs.download-cef.outputs.cef_version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev libx11-dev \
            libnss3-dev libatk1.0-dev \
            libxcomposite-dev libxdamage-dev libxext-dev \
            libxfixes-dev libxrandr-dev libxrender-dev

      - name: Install build tools
        run: python tools/requirements.py

      - name: Prepare prebuilt CEF
        run: python tools/automate.py --prebuilt-cef

      - name: Build wheel
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            re='^[0-9]+\.[0-9]+(\.[0-9]+)?((a|b|rc)[0-9]+)?$'
            if ! [[ "$RELEASE_VERSION" =~ $re ]]; then
              echo "Invalid version: $RELEASE_VERSION"
              exit 1
            fi
            python tools/build.py --wheel --version "$RELEASE_VERSION"
          else
            python tools/build.py --wheel
          fi

      - name: Upload per-Python wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-py${{ matrix.python-version }}
          path: build/dist/*.whl
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  merge:
    needs: build
    # Merging is plain zip handling, so it runs on Linux.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      pythons: ${{ steps.merge.outputs.pythons }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download per-Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-py*
          merge-multiple: true
          path: build/py_wheels

      - name: Merge wheels
        id: merge
        run: |
          python tools/merge_wheels.py --out-dir build/dist build/py_wheels/*.whl
          # The test jobs run exactly the Python versions in the merged wheel
          tags=$(basename build/dist/*.whl | cut -d- -f3)
          python -c 'import json, sys; print("pythons=" + json.dumps([t[2] + "." + t[3:] for t in sys.argv[1].split(".")]))' "$tags" >> "$GITHUB_OUTPUT"

      - name: Upload merged wheel for the test jobs
        uses: actions/upload-artifact@v7
        with:
          name: merged-wheel
          path: build/dist/*.whl
          retention-days: 1
          compression-level: 0

  test:
    needs: merge
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.merge.outputs.pythons) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        # libgtk-3-0: cefpython_pyXY.so links against GTK 3. The build job got
        # it through libgtk-3-dev, which this job doesn't install.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libx11-6 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxrandr2 libxrender1 \
            libglib2.0-0 xvfb

      - name: Download merged wheel
        uses: actions/download-artifact@v8
        with:
          name: merged-wheel
          path: build/dist

      - name: Unit-test the merged wheel
        run: |
          # Install the merged wheel and run the unit tests against the
          # INSTALLED package. No PYTHONPATH and no dev .pth, so
          # import cefpython3 resolves to the installed wheel.
          pip install build/dist/*.whl
          xvfb-run python unittests/_test_runner.py

      - name: Smoke-test the merged wheel
        timeout-minutes: 5
        run: xvfb-run python tools/smoke_test.py

  publish:
    # The wheel artifact exists only if the merged wheel passed on every
    # Python version.
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download merged wheel
        uses: actions/download-artifact@v8
        with:
          name: merged-wheel
          path: build/dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/dist/*.whl
          archive: false
